# Testet jeden Push auf main und veröffentlicht auf GitHub Pages, sobald ein
# Release-Tag (v*) gepusht wird. main ist damit Arbeitsstand, nicht Produktion.
# Einmalig im Repo: Settings → Pages → Source: „GitHub Actions“.
name: Test und Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          TZ: Europe/Berlin
      - run: npm run build
      # Nur für ein Release hochladen; auf main bleibt es ein reiner Testlauf.
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: dist

  deploy:
    needs: build
    # Greift beim Tag-Push und bei einem manuellen Lauf auf einem Tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Nicht abbrechen: ein laufender Deploy soll fertig werden.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
